<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crimson Exhibition</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: #f7f4f0;
    color: #222;
}

/* Navigation */

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 8%;
    background: white;
    border-bottom: 1px solid #e5e0dc;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #9b1c31;
}

nav a {
    text-decoration: none;
    color: #555;
    margin-left: 18px;
    font-size: 14px;
}

/* Hero */

.hero {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
}

.hero-content {
    max-width: 700px;
}

.hero h1 {
    font-size: 55px;
    letter-spacing: 4px;
    margin-bottom: 20px;
    color: #9b1c31;
}

.hero p {
    font-size: 18px;
    line-height: 1.8;
    color: #666;
    margin-bottom: 30px;
}

.button {
    display: inline-block;
    background: #9b1c31;
    color: white;
    padding: 14px 30px;
    text-decoration: none;
    border-radius: 4px;
    transition: 0.3s;
}

.button:hover {
    transform: scale(1.05);
}

/* Chapters */

.chapters {
    padding: 70px 8%;
    background: white;
}

.section-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 45px;
    color: #9b1c31;
}

.chapter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

.chapter-card {
    background: #f7f4f0;
    padding: 30px;
    border-radius: 8px;
    transition: 0.3s;
}

.chapter-card:hover {
    transform: translateY(-5px);
}

.chapter-card h3 {
    margin-bottom: 12px;
}

.chapter-card p {
    color: #666;
    margin-bottom: 20px;
}
